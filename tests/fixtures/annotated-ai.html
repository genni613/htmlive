<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>HTMLive annotated AI test</title></head>
<body>
  <main class="landing-page">
    <section class="hero">
      <h1 id="hero-title">旧标题</h1>
      <p id="untargeted-copy">帮助用户理解这个页面的上下文。</p>
      <button id="hero-cta">旧按钮</button>
      <input id="file-control" type="file">
    </section>
  </main>
  <output id="test-result">running</output>
  <script>
    if (window.top === window.self) {
      localStorage.setItem('ai-editor-endpoint', 'https://example.test/v1');
      localStorage.setItem('ai-editor-model', 'test-model');
      const script = document.createElement('script');
      script.setAttribute('data-htmlive-editor-loader', '');
      script.src = '../../assets/editor.js';
      script.onload = () => window.setTimeout(runTest, 0);
      document.head.append(script);
    }

    async function runTest() {
      const result = document.querySelector('#test-result');
      try {
        let requestBody = null;
        let requestCount = 0;
        let exportedBlob = null;
        URL.createObjectURL = (blob) => { exportedBlob = blob; return 'blob:htmlive-ai-test'; };
        HTMLAnchorElement.prototype.click = function () {};
        window.showSaveFilePicker = undefined;
        window.fetch = async (_url, options) => {
          requestBody = JSON.parse(options.body);
          requestCount += 1;
          const titleId = document.querySelector('#hero-title').getAttribute('data-ai-id');
          const ctaId = document.querySelector('#hero-cta').getAttribute('data-ai-id');
          const mods = requestCount === 1 ? [
              { aiId: titleId, action: 'html', html: '面向未来的产品' },
              { aiId: ctaId, action: 'html', html: '立即体验' },
              { aiId: ctaId, action: 'style', style: { backgroundColor: '#2563eb', color: '#ffffff' } },
              { selector: '#untargeted-copy', action: 'html', html: '不应被模型越权修改' }
            ] : [
              { aiId: titleId, action: 'html', html: '简洁而面向未来' }
            ];
          const content = `已完成修改。\n\`\`\`json\n${JSON.stringify(mods)}\n\`\`\``;
          if (requestCount === 2) {
            return new Response(JSON.stringify({ choices: [{ message: { content } }] }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }
          const body = `data:${JSON.stringify({ choices: [{ delta: { content } }] })}\n\ndata:[DONE]\n\n`;
          return new Response(body, { status: 200, headers: { 'Content-Type': 'text/event-stream' } });
        };

        const title = document.querySelector('#hero-title');
        const cta = document.querySelector('#hero-cta');
        let titleProbeCount = 0;
        title.addEventListener('htmlive-probe', () => { titleProbeCount += 1; });
        title.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        document.querySelector('.ai-editor-annotate-btn').click();
        const textField = document.querySelector('[data-inspector-prop="text"]');
        const colorField = document.querySelector('[data-inspector-prop="color"]');
        const backgroundField = document.querySelector('[data-inspector-prop="background-color"]');
        const fontSizeField = document.querySelector('[data-inspector-prop="font-size"]');
        if (!textField || !colorField || !backgroundField || !fontSizeField) {
          throw new Error('annotation popover did not expose the element basics');
        }
        if (textField.value !== '旧标题') throw new Error('annotation popover did not read the element text');
        textField.value = '先直接编辑标题';
        colorField.value = '#123456';
        backgroundField.value = '#abcdef';
        backgroundField.dispatchEvent(new Event('input', { bubbles: true }));
        fontSizeField.value = '22';
        let annotationInput = document.querySelector('.ai-editor-annotate-input');
        annotationInput.value = '改成更有科技感的中文标题';
        document.querySelector('.ai-editor-annotate-done').click();
        if (title.textContent !== '先直接编辑标题') throw new Error('direct text edit was not applied');
        if (title.style.color !== 'rgb(18, 52, 86)') throw new Error('direct color edit was not applied');
        if (title.style.backgroundColor !== 'rgb(171, 205, 239)') throw new Error('direct background edit was not applied');
        if (title.style.fontSize !== '22px') throw new Error('direct font-size edit was not applied');

        document.querySelector('[data-action="edit-mode"]').click();
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', metaKey: true, bubbles: true }));
        const titleAfterUndo = document.querySelector('#hero-title');
        titleAfterUndo.dispatchEvent(new CustomEvent('htmlive-probe'));
        if (titleProbeCount !== 1) throw new Error('inspector undo replaced the element and lost its event listeners');
        if (titleAfterUndo.textContent !== '旧标题') throw new Error('inspector edit was not undone in place');
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', metaKey: true, shiftKey: true, bubbles: true }));
        if (document.querySelector('#hero-title').textContent !== '先直接编辑标题') throw new Error('inspector edit was not redone in place');

        cta.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const annotateButtons = document.querySelectorAll('.ai-editor-annotate-btn');
        annotateButtons[annotateButtons.length - 1].click();
        annotationInput = document.querySelector('.ai-editor-annotate-input');
        annotationInput.value = '文案改成立即体验，并使用蓝底白字';
        document.querySelector('.ai-editor-annotate-done').click();
        if (cta.style.backgroundColor) throw new Error('saving an annotation changed a transparent background unexpectedly');

        const fileControl = document.querySelector('#file-control');
        fileControl.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const fileAnnotateButtons = document.querySelectorAll('.ai-editor-annotate-btn');
        fileAnnotateButtons[fileAnnotateButtons.length - 1].click();
        const fileTextField = document.querySelector('[data-inspector-prop="text"]');
        if (!fileTextField.disabled) throw new Error('non-text input exposed its submission value as editable copy');
        fileTextField.value = 'must-not-throw';
        const transparentButton = document.querySelector('.ai-editor-inspector-transparent');
        transparentButton.click();
        if (!transparentButton.classList.contains('ai-editor-active')) throw new Error('transparent control did not activate');
        document.querySelector('.ai-editor-annotate-done').click();
        if (!['transparent', 'rgba(0, 0, 0, 0)'].includes(fileControl.style.backgroundColor)) {
          throw new Error(`background color could not be restored to transparent: ${fileControl.style.backgroundColor}`);
        }
        cta.dispatchEvent(new MouseEvent('click', { bubbles: true }));

        const chatInput = document.querySelector('.ai-editor-input');
        if (chatInput.value) throw new Error('test requires an empty global instruction');
        document.querySelector('[data-action="send"]').click();

        for (let index = 0; index < 80 && document.querySelector('#hero-title').textContent !== '面向未来的产品'; index += 1) {
          await new Promise((resolve) => setTimeout(resolve, 25));
        }
        if (!requestBody) throw new Error('annotated elements were not sent when the global input was empty');
        const systemPrompt = requestBody.messages.find((message) => message.role === 'system')?.content || '';
        const userPrompt = requestBody.messages.find((message) => message.role === 'user')?.content || '';
        if (!userPrompt.includes('改成更有科技感的中文标题') || !userPrompt.includes('文案改成立即体验，并使用蓝底白字')) {
          throw new Error('per-element annotations were not sent as user requirements');
        }
        if (!systemPrompt.includes('帮助用户理解这个页面的上下文')) {
          throw new Error('nearby page context was missing from the model request');
        }
        if (!/2.*元素/.test(userPrompt)) throw new Error(`batch instruction was unclear: ${userPrompt}`);
        if (document.querySelector('#hero-title').textContent !== '面向未来的产品') throw new Error('title modification was not previewed');
        if (document.querySelector('#hero-cta').textContent !== '立即体验') throw new Error('CTA modification was not previewed');
        if (document.querySelector('#hero-cta').style.backgroundColor !== 'rgb(37, 99, 235)') throw new Error('CTA style modification was not previewed');
        if (document.querySelector('#untargeted-copy').textContent !== '帮助用户理解这个页面的上下文。') {
          throw new Error('model modified an element outside the annotated task');
        }

        chatInput.value = '整体视觉保持简洁';
        document.querySelector('[data-action="send"]').click();
        for (let index = 0; index < 80 && document.querySelector('#hero-title').textContent !== '简洁而面向未来'; index += 1) {
          await new Promise((resolve) => setTimeout(resolve, 25));
        }
        if (document.querySelector('#hero-title').textContent !== '简洁而面向未来') {
          throw new Error('overall instruction excluded an annotated but unselected element');
        }

        document.querySelector('[data-action="export-html"]').click();
        for (let index = 0; index < 40 && !exportedBlob; index += 1) {
          await new Promise((resolve) => setTimeout(resolve, 25));
        }
        if (!exportedBlob) throw new Error('annotated AI revision did not export HTML');
        const exportedHtml = await exportedBlob.text();
        const exportedDocument = new DOMParser().parseFromString(exportedHtml, 'text/html');
        if (!exportedDocument.querySelector('script[data-htmlive-export-patches]')) {
          throw new Error('annotated AI revision was missing from the exported HTML');
        }
        if (exportedDocument.querySelector('.ai-editor-root') || exportedDocument.querySelector('[data-ai-id]')) {
          throw new Error('editor UI metadata leaked into the exported HTML');
        }
        const frame = document.createElement('iframe');
        frame.srcdoc = exportedHtml;
        document.body.append(frame);
        await new Promise((resolve) => { frame.onload = resolve; });
        await new Promise((resolve) => setTimeout(resolve, 80));
        if (frame.contentDocument.querySelector('#hero-title')?.textContent !== '简洁而面向未来') {
          throw new Error('exported HTML lost the annotated title revision after reload');
        }
        if (frame.contentDocument.querySelector('#hero-title')?.style.color !== 'rgb(18, 52, 86)') {
          throw new Error('exported HTML lost the direct color revision after reload');
        }
        if (frame.contentDocument.querySelector('#hero-title')?.style.backgroundColor !== 'rgb(171, 205, 239)') {
          throw new Error('exported HTML lost the direct background revision after reload');
        }
        if (frame.contentDocument.querySelector('#hero-title')?.style.fontSize !== '22px') {
          throw new Error('exported HTML lost the direct font-size revision after reload');
        }
        if (frame.contentDocument.querySelector('#hero-cta')?.textContent !== '立即体验') {
          throw new Error('exported HTML lost the annotated CTA revision after reload');
        }

        result.textContent = 'pass';
        result.dataset.status = 'pass';
      } catch (error) {
        result.textContent = error && error.message ? error.message : String(error);
        result.dataset.status = 'fail';
      }
    }
  </script>
</body>
</html>
